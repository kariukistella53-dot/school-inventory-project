<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration - SIMS</title>
    <link rel="stylesheet" href="staff.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-logo">SIMS</div>

        <h2>Staff Registration</h2>
        <p>Create your staff account</p>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your real name" required>

            <label>Username</label>
            <input type="text" id="newUsername"
                   placeholder="Create a username" required>

            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="newPassword"
                   placeholder="Create a password" minlength="8" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm your password" required>

            <button type="submit">Register</button>

            <p id="registerMessage"></p>
        </form>

        <a href="staff-login.html">Already registered? Login</a>
    </div>

    <script src="staff.js"></script>
</body>
</html>
